        <p class="hero-roles" data-en="Rooted in <b>sustainability</b>, branching into <b>curation</b> — growing ring by ring across ESG strategy, academic research, and cross-cultural experience." data-ja="<b>サステナビリティ</b>を根とし、<b>キュレーション</b>を枝とする——ESG戦略、学術研究、異文化体験のあいだで、年輪を重ねるように成長を続けています。" data-ko="<b>지속가능성</b>을 뿌리로, <b>큐레이션</b>을 가지로 — ESG 전략과 학술 연구, 문화 간 경험 사이에서 나이테처럼 한 해 한 겹씩 성장해 왔습니다.">以<b>永續</b>為根、以<b>策展</b>為枝——在 ESG 策略、學術研究與跨文化體驗之間，一年一輪，持續生長。</p>
